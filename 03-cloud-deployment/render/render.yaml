# Blueprint cho bài thực hành Part 3.
# Khi tạo Blueprint, đặt Blueprint Path = 03-cloud-deployment/render/render.yaml.
# Ứng dụng mẫu ở Part 2 chỉ dùng mock LLM và không cần secret hay Redis.
services:
  - type: web
    name: day14-agent-part3
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r 02-docker/production/requirements.txt
    startCommand: uvicorn main:app --app-dir 02-docker/production --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: PYTHONPATH
        value: .
