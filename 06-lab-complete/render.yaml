services:
  - type: web
    name: day14-production-agent
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./06-lab-complete/Dockerfile
    dockerContext: ./06-lab-complete
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: 60
      - key: DAILY_BUDGET_USD
        value: 1
